[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brocode-agent"
version = "0.1.0"
description = "A persistent, evidence-oriented browser specialist over ACP and MCP"
requires-python = ">=3.11"
dependencies = [
  "browser-use==0.13.10",
  "agent-client-protocol==0.12.1",
  "mcp==2.1.1",
  "python-dotenv>=1,<2",
  "pydantic>=2.12,<3",
  "psutil>=7,<8",
  "PyYAML>=6,<7",
]

[project.scripts]
brocode = "brocode.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/brocode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
